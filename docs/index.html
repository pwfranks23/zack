<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CartPole RL Demo</title>

  <!-- onnxruntime-web: runs the exported PyTorch model in the browser -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.min.js"></script>
  <!-- pyodide: real CPython + NumPy in WASM, runs the actual Gymnasium physics -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.3/full/pyodide.js"></script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0d14;
      color: #cbd5e1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.5px;
    }

    header h1 em {
      font-style: normal;
      color: #818cf8;
    }

    header p {
      margin-top: 0.4rem;
      font-size: 0.9rem;
      color: #64748b;
    }

    /* ── loading ─────────────────────────────────────────────── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid #1e293b;
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #load-msg {
      font-size: 0.9rem;
      color: #475569;
    }

    /* ── demo ─────────────────────────────────────────────────── */
    #demo {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    canvas {
      display: block;
      border-radius: 10px;
      border: 1px solid #1e293b;
      cursor: crosshair;
    }

    .hud {
      display: flex;
      gap: 2.5rem;
      font-size: 0.875rem;
      color: #475569;
    }

    .hud b {
      color: #e2e8f0;
      font-weight: 600;
    }

    .hint {
      font-size: 0.82rem;
      color: #334155;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .tag {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 0.75rem;
      color: #818cf8;
    }

    footer {
      font-size: 0.78rem;
      color: #1e293b;
    }

    footer a {
      color: #334155;
      text-decoration: none;
    }

    footer a:hover {
      color: #64748b;
    }

    #error-msg {
      display: none;
      color: #f87171;
      font-size: 0.88rem;
      text-align: center;
      max-width: 480px;
    }
  </style>
</head>

<body>
  <header>
    <h1>CartPole <em>RL Agent </em></h1>
    <p>Click to disturb the pole · RL policy trained in PyTorch · Gymnasium physics</p>
  </header>

  <div id="loading">
    <div class="spinner"></div>
    <div id="load-msg">Initialising…</div>
  </div>

  <div id="demo">
    <canvas id="canvas" width="700" height="360"></canvas>
    <div class="hud">
      <span>Episode <b id="hud-ep">1</b></span>
      <span>Step <b id="hud-step">0</b></span>
      <span>Reward <b id="hud-reward">0</b></span>
    </div>
    <div class="hint">
      Click to disturb the pole
      <span class="tag">left = tilt left</span>
      <span class="tag">right = tilt right</span>
    </div>
  </div>

  <div id="error-msg"></div>

  <footer>
    <a href="https://pwfranks23.github.io/zack/" target="_blank">https://pwfranks23.github.io/zack/</a>
    &nbsp;·&nbsp; Gymnasium · PyTorch · Pyodide · ONNX Runtime Web
  </footer>

  <script>
    (() => {
      "use strict";

      // ── constants ──────────────────────────────────────────────────────────────
      const W = 700, H = 360;
      const TRACK_Y = 265;        // y-pixel of the track rail
      const SCALE = 115;          // pixels per metre
      const POLE_PX = 140;        // visual pole length in pixels
      const CART_W = 60, CART_H = 28;
      const X_THRESH = 2.4;       // CartPole cart position limit (metres)
      const THETA_THRESH = 0.2094; // CartPole pole angle limit (radians, ~12°)
      const STEP_MS = 20;         // 50 fps — matches CartPole tau=0.02 s
      const MAX_KICK = 1.5;       // max angular velocity kick from click

      // ── state ──────────────────────────────────────────────────────────────────
      let pyodide = null;
      let ortSession = null;
      let obs = [0, 0, 0, 0];
      let episodeCount = 1;
      let stepCount = 0;
      let episodeReward = 0;
      let running = false;

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      // ── loading helpers ────────────────────────────────────────────────────────
      function setMsg(text) {
        document.getElementById("load-msg").textContent = text;
      }

      function showError(err) {
        const el = document.getElementById("error-msg");
        el.style.display = "block";
        el.textContent = "Failed to load demo: " + err.message;
        document.getElementById("loading").style.display = "none";
      }

      // ── initialisation ─────────────────────────────────────────────────────────
      async function init() {
        try {
          // Load Pyodide and onnxruntime-web in parallel where possible.
          // ort is loaded via <script> tag above; Pyodide loads itself.
          setMsg("Loading Python runtime (first load ~15 s)…");
          pyodide = await loadPyodide({
            indexURL: "https://cdn.jsdelivr.net/pyodide/v0.27.3/full/"
          });

          setMsg("Installing gymnasium…");
          await pyodide.loadPackage("micropip");
          await pyodide.runPythonAsync(`
import micropip
await micropip.install("gymnasium")
import json
import gymnasium as gym
import numpy as np
env = gym.make("CartPole-v1")
_obs, _info = env.reset(seed=0)
        `);

          setMsg("Loading policy model…");
          ortSession = await ort.InferenceSession.create("./model.onnx");

          // Read initial observation
          obs = JSON.parse(pyodide.runPython(`
import json
json.dumps(env.unwrapped.state.tolist())
        `));

          setMsg("Ready!");
          document.getElementById("loading").style.display = "none";
          document.getElementById("demo").style.display = "flex";

          canvas.addEventListener("click", handleClick);
          running = true;
          render();
          setTimeout(loop, STEP_MS);
        } catch (err) {
          showError(err);
        }
      }

      // ── game loop ──────────────────────────────────────────────────────────────
      // Uses recursive setTimeout so ticks never overlap regardless of how long
      // Pyodide / ort inference takes.
      async function loop() {
        if (!running) return;
        try {
          await tick();
        } catch (err) {
          console.error("Tick error:", err);
        }
        setTimeout(loop, STEP_MS);
      }

      async function tick() {
        // 1. Inference: forward pass through ONNX model
        const inputTensor = new ort.Tensor("float32", Float32Array.from(obs), [1, 4]);
        const output = await ortSession.run({ state: inputTensor });
        const logits = output.logits.data;
        const action = logits[0] >= logits[1] ? 0 : 1;

        // 2. Physics: step the real Gymnasium environment in Pyodide
        const resultJson = pyodide.runPython(`
import json
_obs, _rew, _term, _trunc, _info = env.step(${action})
json.dumps({
  "obs": _obs.tolist(),
  "reward": float(_rew),
  "terminated": bool(_term),
  "truncated": bool(_trunc)
})
      `);
        const { obs: newObs, reward, terminated, truncated } = JSON.parse(resultJson);

        obs = newObs;
        episodeReward += reward;
        stepCount += 1;

        // 3. Render and update HUD
        render();
        updateHUD();

        // 4. Reset if episode ended
        if (terminated || truncated) {
          episodeCount += 1;
          stepCount = 0;
          episodeReward = 0;
          obs = JSON.parse(pyodide.runPython(`
import json
_obs, _info = env.reset()
json.dumps(_obs.tolist())
        `));
        }
      }

      // ── click disturbance ──────────────────────────────────────────────────────
      function handleClick(e) {
        if (!pyodide) return;
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const normalized = Math.max(-1, Math.min(1, (clickX - W / 2) / (W / 2)));
        const kick = (normalized * MAX_KICK).toFixed(6);
        pyodide.runPython(`
import numpy as np
_s = list(env.unwrapped.state)
_s[3] += ${kick}
env.unwrapped.state = np.array(_s, dtype=np.float32)
      `);
        // Sync obs after disturbance so next inference sees the kicked state.
        obs = JSON.parse(pyodide.runPython(`
import json
json.dumps(env.unwrapped.state.tolist())
      `));
      }

      // ── rendering ──────────────────────────────────────────────────────────────
      function render() {
        const [cartPos, , poleAngle] = obs;
        const cx = W / 2 + cartPos * SCALE;

        ctx.clearRect(0, 0, W, H);

        // background
        ctx.fillStyle = "#0b0d14";
        ctx.fillRect(0, 0, W, H);

        drawTrack(cx);
        drawCart(cx);
        drawPole(cx, poleAngle);
      }

      function drawTrack(cx) {
        const left = W / 2 - X_THRESH * SCALE;
        const right = W / 2 + X_THRESH * SCALE;
        const railY = TRACK_Y + CART_H / 2 + 10;

        // Rail
        ctx.beginPath();
        ctx.strokeStyle = "#1e293b";
        ctx.lineWidth = 3;
        ctx.moveTo(left - 10, railY);
        ctx.lineTo(right + 10, railY);
        ctx.stroke();

        // Threshold markers
        ctx.setLineDash([4, 6]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#ef4444" + "44";
        [left, right].forEach(x => {
          ctx.beginPath();
          ctx.moveTo(x, TRACK_Y - 100);
          ctx.lineTo(x, railY);
          ctx.stroke();
        });
        ctx.setLineDash([]);
      }

      function drawCart(cx) {
        // Body
        ctx.fillStyle = "#e2e8f0";
        ctx.beginPath();
        ctx.roundRect(cx - CART_W / 2, TRACK_Y - CART_H / 2, CART_W, CART_H, 4);
        ctx.fill();

        // Wheels
        ctx.fillStyle = "#475569";
        [cx - CART_W * 0.28, cx + CART_W * 0.28].forEach(wx => {
          ctx.beginPath();
          ctx.arc(wx, TRACK_Y + CART_H / 2 + 2, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.strokeStyle = "#64748b";
          ctx.lineWidth = 1.5;
          ctx.arc(wx, TRACK_Y + CART_H / 2 + 2, 4, 0, Math.PI * 2);
          ctx.stroke();
        });
      }

      function drawPole(cx, poleAngle) {
        const pivotY = TRACK_Y - CART_H / 2;
        const tipX = cx + Math.sin(poleAngle) * POLE_PX;
        const tipY = pivotY - Math.cos(poleAngle) * POLE_PX;

        // Severity: 0 = upright (good), 1 = at threshold (bad)
        const severity = Math.min(1, Math.abs(poleAngle) / THETA_THRESH);
        const poleColor = lerpColor("#4ade80", "#f87171", severity);

        ctx.beginPath();
        ctx.strokeStyle = poleColor;
        ctx.lineWidth = 7;
        ctx.lineCap = "round";
        ctx.moveTo(cx, pivotY);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();

        // Tip dot
        ctx.beginPath();
        ctx.fillStyle = poleColor;
        ctx.arc(tipX, tipY, 5, 0, Math.PI * 2);
        ctx.fill();

        // Pivot dot
        ctx.beginPath();
        ctx.fillStyle = "#94a3b8";
        ctx.arc(cx, pivotY, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // ── utilities ──────────────────────────────────────────────────────────────
      function lerpColor(hex1, hex2, t) {
        const r1 = parseInt(hex1.slice(1, 3), 16);
        const g1 = parseInt(hex1.slice(3, 5), 16);
        const b1 = parseInt(hex1.slice(5, 7), 16);
        const r2 = parseInt(hex2.slice(1, 3), 16);
        const g2 = parseInt(hex2.slice(3, 5), 16);
        const b2 = parseInt(hex2.slice(5, 7), 16);
        const r = Math.round(r1 + (r2 - r1) * t);
        const g = Math.round(g1 + (g2 - g1) * t);
        const b = Math.round(b1 + (b2 - b1) * t);
        return `rgb(${r},${g},${b})`;
      }

      function updateHUD() {
        document.getElementById("hud-ep").textContent = episodeCount;
        document.getElementById("hud-step").textContent = stepCount;
        document.getElementById("hud-reward").textContent = episodeReward.toFixed(0);
      }

      // ── start ──────────────────────────────────────────────────────────────────
      init();
    })();
  </script>
</body>

</html>
